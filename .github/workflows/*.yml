name: Extract AOSP Components

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Instalar ferramentas
        run: |
          sudo apt update
          sudo apt install -y git python3

      - name: Instalar repo
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Inicializar AOSP
        run: |
          mkdir aosp
          cd aosp
          repo init -u https://android.googlesource.com/platform/manifest -b android-latest-release
          repo sync -c --no-tags --no-clone-bundle -j4

      - name: Copiar componentes
        run: |
          mkdir output
          cp -r aosp/packages/SystemUI output/
          cp -r aosp/packages/modules/Wifi output/
          cp -r aosp/frameworks/base output/
          cp -r aosp/system output/

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: TeamOS-Core
          path: output
